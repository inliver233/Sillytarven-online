<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/loader.css" rel="stylesheet">
    <link href="css/welcome-page.css" rel="stylesheet">
    <title>SillyTavern - 欢迎</title>
</head>

<body class="welcome-page">
    <main class="welcome-screen" aria-label="SillyTavern 账户入口">
        <div class="st-loader-aura st-aura-1"></div>
        <div class="st-loader-aura st-aura-2"></div>
        <div class="st-loader-aura st-aura-3"></div>

        <section class="st-loader-card welcome-card">
            <div class="st-loader-logo-wrapper">
                <div class="st-loader-logo-glow"></div>
                <img src="img/logo.png" alt="SillyTavern" class="st-loader-logo" onerror="this.style.display='none'; document.getElementById('welcomeFallbackIcon').style.display='block';">
                <i id="welcomeFallbackIcon" class="fa-solid fa-wine-glass-empty" aria-hidden="true"></i>
            </div>

            <nav class="welcome-actions" aria-label="账户操作">
                <a href="/login" class="welcome-action welcome-action-primary">
                    <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                    <span>登录</span>
                </a>
                <a href="/register" class="welcome-action welcome-action-secondary" id="registrationLink">
                    <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                    <span>注册</span>
                </a>
            </nav>
        </section>
    </main>

    <script src="scripts/public-pages-config.js"></script>
</body>

</html>
