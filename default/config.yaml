# -- DATA CONFIGURATION --
# Root directory for user data storage
dataRoot: ./data
# -- SERVER CONFIGURATION --
# Listen for incoming connections
listen: true
# Listen on a specific address, supports IPv4 and IPv6
listenAddress:
  ipv4: 0.0.0.0
  ipv6: '[::]'
# Enables IPv6 and/or IPv4 protocols. Need to have at least one enabled!
# - Use option "auto" to automatically detect support
# - Use true or false (no qoutes) to enable or disable each protocol
protocol:
    ipv4: true
    ipv6: false
# Prefers IPv6 for DNS. Enable this on ISPs that don't have issues with IPv6
dnsPreferIPv6: false
# -- BROWSER LAUNCH CONFIGURATION --
browserLaunch:
  # Open the browser automatically on server startup.
  enabled: true
  # Browser to use for opening the URL.
  # NOT SUPPORTED ON ANDROID DEVICES.
  # - Use "default" to use the system default browser
  # - Use "firefox", "chrome", "edge"
  browser: 'default'
  # Overrides the hostname that opens in the browser.
  # - Use "auto" to let the server decide
  # - Use options like 'localhost', 'st.example.com'
  hostname: 'auto'
  # Overrides the port for run in the browser.
  # - Use -1 to use the server port.
  # - Specify a port to override the default.
  port: -1
  # Avoids using 'localhost' as the hostname in auto mode.
  # Use if you don't have 'localhost' in your hosts file
  avoidLocalhost: false
# Server port
port: 8000
# Interval in seconds to write a heartbeat file. Set to 0 to disable.
# This is used primarily for Docker healthchecks.
heartbeatInterval: 0
# Enable HTTP/HTTPS keep-alive globally.
# Disabling restores old Node 18 behavior, can help if ECONNRESET and other network errors occur.
enableKeepAlive: false
# -- SSL options --
ssl:
  # Enable SSL/TLS encryption
  enabled: false
  # Path to certificate (relative to server root)
  certPath: "./certs/cert.pem"
  # Path to private key (relative to server root)
  keyPath: "./certs/privkey.pem"
  # Private key passphrase (leave empty if not needed)
  # For better security, use a CLI argument or an environment variable (SILLYTAVERN_SSL_KEYPASSPHRASE)
  keyPassphrase: ""
# -- SECURITY CONFIGURATION --
# Toggle whitelist mode
whitelistMode: false
# Whitelist will also verify IP in X-Forwarded-For / X-Real-IP headers
enableForwardedWhitelist: false
# Whitelist of allowed IP addresses
whitelist:
  - ::1
  - 127.0.0.1
# Automatically whitelist Docker host and gateway IPs
whitelistDockerHosts: true
# Toggle basic authentication for endpoints
basicAuthMode: false
# Basic authentication credentials
basicAuthUser:
  username: "user"
  password: "password"
# Enables CORS proxy middleware
enableCorsProxy: false
# CORS settings (applied to all routes)
cors:
  # Enable or disable CORS middleware
  enabled: true
  # Allowed origins. Use "null" to match the default browser file origin.
  # You can set "*" to allow any origin, or a list of allowed origins.
  origin:
    - "null"
  # Allowed methods
  methods:
    - "OPTIONS"
  # Allowed request headers (optional)
  allowedHeaders: []
  # Exposed response headers (optional)
  exposedHeaders: []
  # Allow credentials (cookies, authorization headers)
  credentials: false
  # Preflight cache max age in seconds (optional)
  maxAge: null
# -- REQUEST PROXY CONFIGURATION --
requestProxy:
  # If a proxy is enabled, all outgoing HTTP/HTTPS requests will be routed through it.
  enabled: false
  # Proxy URL. Possible protocols: http, https, socks, socks5, socks4, pac
  url: "socks5://username:password@example.com:1080"
  # Proxy bypass list. Requests to these hosts won't be routed through the proxy.
  bypass:
    - localhost
    - 127.0.0.1
# Enable multi-user mode
enableUserAccounts: true
# Enable discreet login mode: hides user list on the login screen
enableDiscreetLogin: true
# Passkeys: sign in with a fingerprint, face or device PIN. Users add them in
# their account settings (up to 10). Not used when stcontrol handles sign-in.
passkeys:
  enabled: false
  # Domain the passkeys belong to; defaults to the requested host. A parent
  # domain (example.com) makes them work on all of its subdomains.
  rpId: ''
  # Name shown by the passkey manager
  rpName: ''
  # Page origins allowed to use them, e.g. ['https://chat.example.com'];
  # defaults to the origin of the request
  origins: []
# If `basicAuthMode` and this are enabled then
# the username and passwords for basic auth are the same as those
# for the individual accounts
perUserBasicAuth: false

# -- SSO LOGIN CONFIGURATION --
sso:
  # Enable's authlia based auto login. Only enable this if you
  # have setup and installed Authelia as a middle-ware on your
  # reverse proxy
  # https://www.authelia.com/
  # This will use auto login to an account with the same username
  # as that used for authlia. (Ensure the username in authlia
  # is an exact match in lowercase with that in sillytavern)
  autheliaAuth: false
  # Enable's authentik based auto login. Only enable this if you
  # have setup and installed Authentik as a middle-ware on your
  # reverse proxy.
  # https://goauthentik.io/
  # This will use auto login to an account with the same username
  # as that used for authentik. (Ensure the username in authentik
  # is an exact match in lowercase with that in sillytavern).
  authentikAuth: false
  # List of trusted proxy IPs for SSO authentication.
  # Supports wildcards or CIDR notation for subnets.
  # Example: ['127.0.0.1', '192.168.1.1']
  # Set to ['*'] to trust all proxies (NOT RECOMMENDED unless you have other security measures in place)
  trustedProxies:
    - ::1
    - 127.0.0.1

# Host whitelist configuration. Recommended if you're using a listen mode
hostWhitelist:
  # Enable or disable host whitelisting
  enabled: false
  # Scan incoming requests for potential host header spoofing
  scan: false
  # List of allowed hosts. Do not include localhost or IPs, these are safe.
  # Use a dot to create subdomain patterns.
  # Examples:
  # - example.com
  # - .trycloudflare.com
  hosts: []

# Perform whitelist checks against server-side HTTP requests that resolve to private IP addresses.
# This is an additional layer of security to prevent Server-Side Request Forgery (SSRF) attacks.
# Recommended when listen mode is enabled, or if your server is accessible by untrusted users.
privateAddressWhitelist:
  # Enable private address whitelist to block requests to private IP ranges.
  enabled: false
  # If true, requests to hosts that cannot be resolved will be allowed instead of blocked.
  allowUnresolvedHosts: false
  # Log blocked and allowed requests to the console.
  log:
    # Log blocked requests to the console with a warning message
    blockedRequests: true
    # Log allowed requests to the console with an info message
    allowedRequests: false
  # List of allowed private IP ranges (in CIDR notation or wildcard format).
  # Allows loopback IP ranges by default, but you can customize this list to fit your needs.
  allowedRanges:
    - '127.0.0.0/8'      # Loopback (IPv4)
    - '::1/128'          # Loopback (IPv6)

# User session timeout *in seconds* (defaults to 24 hours).
## Set to a positive number to expire session after a certain time of inactivity
## Set to 0 to expire session when the browser is closed
## Set to a negative number to disable session expiration
sessionTimeout: -1
# Disable CSRF protection - NOT RECOMMENDED
disableCsrfProtection: false
# Disable startup security checks - NOT RECOMMENDED
securityOverride: false
# -- LOGGING CONFIGURATION --
logging:
  # Enable access logging to access.log file and console output
  # Records new connections with timestamp, IP address and user agent
  enableAccessLog: true
  # Minimum log level to display in the terminal (DEBUG = 0, INFO = 1, WARN = 2, ERROR = 3)
  minLogLevel: 1
# -- UPLOAD AND ARCHIVE RESOURCE LIMITS --
uploads:
  maxFileBytes: 524288000
  maxFieldBytes: 524288000
  backgrounds:
    maxFileBytes: 67108864
    maxPixels: 100000000
imports:
  archive:
    maxEntries: 1024
    maxEntryBytes: 134217728
    maxTotalBytes: 268435456
    maxCompressionRatio: 200
# -- RATE LIMITING CONFIGURATION --
rateLimiting:
  # Use Express's trusted client IP. Forwarding headers are accepted only from
  # the reverse proxies configured by the application.
  preferRealIpHeader: true
  # Set the maximum number of allowed failed basic authentication attempts before rate limiting is applied. Set to 0 to disable rate limiting for basic auth.
  basicAuthMaxAttempts: 5
  # Set the maximum number of allowed failed account login attempts before rate limiting is applied. Set to 0 to disable rate limiting for account logins.
  accountsLoginMaxAttempts: 5
  # Set the maximum number of allowed failed account recovery attempts before rate limiting is applied. Set to 0 to disable rate limiting for account recovery.
  accountsRecoverMaxAttempts: 5
  # Set the maximum number of allowed failed account reset attempts before rate limiting is applied. Set to 0 to disable rate limiting for account resets.
  accountsResetMaxAttempts: 5

## BACKUP CONFIGURATION
backups:
  # Allow users to create a full backup archive of their data
  allowFullDataBackup: true
  # Common settings for all backup types
  common:
    # Number of backups to keep for each chat and settings file
    numberOfBackups: 50
  chat:
    # Enable automatic chat backups
    enabled: true
    # Verify integrity of chat files before saving
    checkIntegrity: true
    # Maximum number of chat backups to keep per user (starting from the most recent). Set to -1 to keep all backups.
    maxTotalBackups: -1
    # Interval in milliseconds to throttle chat backups per user (15 minutes)
    throttleInterval: 900000

# THUMBNAILING CONFIGURATION
thumbnails:
  # Enable thumbnail generation
  enabled: true
  # Skip thumbnail generation during server startup (recommended for large user bases)
  # Thumbnails will be generated on-demand when first requested (lazy loading)
  # Set to true to speed up startup time significantly with many users
  # skipStartupGeneration: true
  # Image format of avatar thumbnails:
  # * "jpg": best compression with adjustable quality, no transparency
  # * "png": preserves transparency but increases filesize by about 100%
  # Changing this only affects new thumbnails. To recreate the old ones, clear out /thumbnails folder in your user data.
  format: "jpg"
  # JPG thumbnail quality (0-100)
  quality: 95
  # Maximum thumbnail dimensions per type [width, height]
  # 'card' is the larger character picture on the welcome screen.
  dimensions: { 'bg': [160, 90], 'avatar': [96, 144], 'persona': [96, 144], 'card': [360, 540] }

# PERFORMANCE-RELATED CONFIGURATION
performance:
  # Enables lazy loading of character cards. Improves performances with large card libraries.
  # May have compatibility issues with some extensions.
  lazyLoadCharacters: false
  # The maximum amount of memory that parsed character cards can use. Set to 0 to disable memory caching.
  memoryCacheCapacity: '100mb'
  # Enables disk caching for character cards. Improves performances with large card libraries.
  useDiskCache: true
  # Collect bounded, content-free endpoint and browser timing samples for the administrator dashboard.
  telemetry:
    enabled: true
    # Maximum retained samples for each operation. Oldest samples are evicted first.
    samplesPerOperation: 200
    # Maximum retained serialized sample bytes for each operation.
    bytesPerOperation: 262144
    # Per-user browser timing samples accepted per minute.
    clientSamplesPerMinute: 120
  # Versioned range/tail-save protocol. Disable if an existing deployment needs the full-save path.
  chatPaging:
    enabled: true
  # Skip layout/paint for distant messages only after conservative long-chat thresholds are met.
  longChatDomRenderOptimization:
    enabled: true
  # Memoize the complete /version payload while package.json and Git HEAD/ref stay unchanged.
  # The page sends the app's startup reads (settings, secrets, extensions, ...) itself as soon
  # as it starts to load, all at once, instead of one after another once the modules have run.
  startupPrefetch: true
  # Load the app's own files (everything under /v/) from a CDN mirror, e.g. a
  # domain whose DNS sends mainland China to a local CDN and everyone else to Cloudflare.
  # The CDN pulls /v/... from this server (responses are public, immutable and allow CORS).
  # A page that cannot load from the mirror tries again once, then uses this server for 30 minutes.
  # baseUrl empty = off. timeZones empty = every visitor; otherwise only browsers in them.
  assetCdn:
    baseUrl: ''
    timeZones: []
    # Popular third-party extensions also loaded from the CDN, at their commit. Only a git
    # checkout of one of the listed repositories (mirror proxies are fine) with no changes to
    # tracked files qualifies; anything else loads from this server as before.
    extensions:
      - name: JS-Slash-Runner
        repos: [github.com/N0VI028/JS-Slash-Runner, gitlab.com/novi028/JS-Slash-Runner]
      - name: ST-Prompt-Template
        repos: [github.com/zonde306/ST-Prompt-Template, gitlab.com/zonde306/ST-Prompt-Template, codeberg.org/zonde306/ST-Prompt-Template]
      - name: LittleWhiteBox
        repos: [github.com/RT15548/LittleWhiteBox]
      - name: ST-BaiBai-Book
        repos: [github.com/baibai-git/ST-BaiBai-Book]
      - name: ST-BaiBai-Tools
        repos: [github.com/baibai-git/ST-BaiBai-Tools]
  versionMemo:
    enabled: true
    ttlMs: 30000
  # Complete, never-placeholder character list cache. Existing card parsers remain authoritative.
  characterListCache:
    enabled: true
    concurrency: 6
    ttlMs: 30000
    # Full PNG name/size/mtime rescan interval for detecting out-of-process edits.
    signatureTtlMs: 5000
    maxEntries: 100
    maxBytes: 104857600
    # Browsers keep the cards they downloaded and fetch only cards whose file changed since.
    # Set to false to always send the full list.
    browserCopies: true
  # Asynchronously build and retain complete per-user /api/settings/get payloads.
  settingsCache:
    enabled: true
    ioConcurrency: 8
    ttlMs: 30000
    signatureTtlMs: 5000
    maxEntries: 100
    maxBytes: 104857600
  # Cache complete /api/chats/recent responses; successful mutations invalidate every user variant.
  recentChatsCache:
    enabled: true
    ttlMs: 15000
    # Root directory checks catch common out-of-process changes; TTL bounds nested-file staleness.
    signatureTtlMs: 2000
    maxEntries: 300
    maxVariantsPerUser: 8
    maxBytes: 52428800
  # Configures gzip compression for client requests with large payloads (e.g. settings or chat saves).
  requestCompression:
    # Enable request compression.
    enabled: false
    # Minimum payload size to trigger compression. Set to 0 to compress all requests regardless of size.
    minPayloadSize: '256kb'
    # Hard upper payload size limit for compression. Set to 0 to allow compression of any size.
    maxPayloadSize: '8mb'
    # Timeout for request compression in milliseconds.
    timeout: 4000

# CACHE BUSTER CONFIGURATION
# IMPORTANT: Requires localhost or a domain with HTTPS, otherwise will not work!
cacheBuster:
  # Clear browser cache on first load or after uploading image files
  enabled: false
  # Only clear cache for the specified user agent regex pattern
  # Example: 'firefox|safari' (case-insensitive)
  userAgentPattern: ''

# Allow secret keys exposure via API
allowKeysExposure: false
# Skip new default content checks
skipContentCheck: false
# Allowed hosts for card downloads
whitelistImportDomains:
  - localhost
  - cdn.discordapp.com
  - files.catbox.moe
  - raw.githubusercontent.com
# API request overrides (for KoboldAI and Text Completion APIs)
## Note: host includes the port number if it's not the default (80 or 443)
## Format is an array of objects:
## - hosts:
##   - example.com
##   headers:
##     Content-Type: application/json
##   - 127.0.0.1:5001
##   headers:
##     User-Agent: "Googlebot/2.1 (+http://www.google.com/bot.html)"
requestOverrides: []

# EXTENSIONS CONFIGURATION
extensions:
  # Enable UI extensions
  enabled: true
  # Automatically update extensions when a release version changes
  autoUpdate: true
  models:
    # Enables automatic model download from HuggingFace
    autoDownload: true
    # Additional models for extensions. Expects model IDs from HuggingFace model hub in ONNX format
    classification: Cohee/distilbert-base-uncased-go-emotions-onnx
    captioning: Xenova/vit-gpt2-image-captioning
    embedding: Cohee/jina-embeddings-v2-base-en
    speechToText: Xenova/whisper-small
    textToSpeech: Xenova/speecht5_tts

# Git backend for plugin/extension repository operations.
# - Use "auto" to prefer system git, falling back to the integrated backend
# - Use "system" to force system backend
# - Use "builtin" to force integrated backend
git:
  backend: auto

# Additional model tokenizers can be downloaded on demand.
# Disabling will fallback to another locally available tokenizer.
enableDownloadableTokenizers: true
# -- OPENAI CONFIGURATION --
# A placeholder message to use in strict prompt post-processing mode when the prompt doesn't start with a user message
promptPlaceholder: "[Start a new chat]"
openai:
  # Will send a random user ID to OpenAI completion API
  randomizeUserId: false
  # If not empty, will add this as a system message to the start of every caption completion prompt
  # Example: "Perform the instructions to the best of your ability.\n" (for LLaVA)
  # Not used in image inlining mode
  captionSystemPrompt: ""
# -- DEEPL TRANSLATION CONFIGURATION --
deepl:
  # Available options: default, more, less, prefer_more, prefer_less
  formality: default
# -- MISTRAL API CONFIGURATION --
mistral:
  # Enables prefilling of the reply with the last assistant message in the prompt
  # CAUTION: The prefix is echoed into the completion. You may want to use regex to trim it out.
  enablePrefix: false
# -- OLLAMA API CONFIGURATION --
ollama:
  # Controls how long the model will stay loaded into memory following the request
  # * -1: Keep the model loaded indefinitely
  # * 0: Unload the model immediately after the request
  # * N (any positive number): Keep the model loaded for N seconds after the request.
  keepAlive: -1
  # Controls the "num_batch" (batch size) parameter of the generation request
  # * -1: Use the default value of the model
  # * N (positive number): Use the specified value. Must be a power of 2, e.g. 128, 256, 512, etc.
  batchSize: -1
# -- ANTHROPIC CLAUDE API CONFIGURATION --
claude:
  # Enables caching of the system prompt (if supported).
  # https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  # -- IMPORTANT! --
  # Use only when the prompt before the chat history is static and doesn't change between requests
  # (e.g {{random}} macro or lorebooks not as in-chat injections).
  # Otherwise, you'll just waste money on cache misses.
  enableSystemPromptCache: false
  # Enables caching of the message history at depth (if supported).
  # https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  # -- IMPORTANT! --
  # Use with caution. Behavior may be unpredictable and no guarantees can or will be made.
  # Set to an integer to specify the desired depth. 0 (which does NOT include the prefill)
  # should be ideal for most use cases.
  # Any value other than a non-negative integer will be ignored and caching at depth will not be enabled.
  cachingAtDepth: -1
  # Use 1h TTL instead of the default 5m.
  ## 5m: base price x 1.25
  ## 1h: base price x 2
  extendedTTL: false
  # Enables adaptive thinking for supported models (Opus 4.6+).
  # Disable to enforce legacy thinking mode (with thinking budget).
  # https://platform.claude.com/docs/en/build-with-claude/adaptive-thinking
  enableAdaptiveThinking: false
# -- GOOGLE GEMINI API CONFIGURATION --
gemini:
  # API endpoint version ("v1beta" or "v1alpha")
  apiVersion: 'v1beta'
  # Adds thought signatures to requests (if available). Only for Gemini 3 and above.
  thoughtSignatures: true
  # Enables caching of the system prompt (if supported). Only for OpenRouter.
  # -- IMPORTANT! --
  # Use only when the prompt before the chat history is static and doesn't change between requests
  # (e.g {{random}} macro or lorebooks not as in-chat injections).
  # Otherwise, you'll just waste money on cache misses.
  enableSystemPromptCache: false
  # https://ai.google.dev/gemini-api/docs/imagen#imagen-configuration
  image:
    # Leave empty to use the API-default value.
    personGeneration: 'allow_adult'
# -- SERVER PLUGIN CONFIGURATION --
enableServerPlugins: false
# Attempt to automatically update server plugins on startup
enableServerPluginsAutoUpdate: true

enableInvitationCodes: false

# -- FEEDBACK FORM LINKS --
# Announcement links to the feedback questionnaire carry the signed-in user ({{user}}).
# With a secret, links to the questionnaire's site are also signed so it can tell which
# account sent a ticket; the same secret goes into the questionnaire's "link signing secret".
# With formUrl the chat menu (☰) also gets a "反馈问题" entry that opens the form directly.
feedback:
  linkSecret: ""
  # Address of the questionnaire, e.g. https://example.com/f/report
  formUrl: ""
  # Value of the link's "site" parameter (an option of the questionnaire's site question)
  site: ""

# -- REGISTRATION CONFIGURATION --
# Each method can independently allow new accounts and require an invitation
# code. null inherits the legacy enableInvitationCodes value above.
registration:
  password:
    enabled: true
    requireInvitationCode: null
  github:
    enabled: true
    requireInvitationCode: null
  discord:
    enabled: true
    requireInvitationCode: null
    # Optional: require new Discord users to have stayed in a guild long enough.
    guildMembership:
      enabled: false
      guildId: ""
      guildName: ""
      minimumDays: 14
  linuxdo:
    enabled: true
    requireInvitationCode: null

# -- USER STORAGE LIMITS --
userStorage:
  # Enable per-user storage limits
  enabled: false
  # Default storage limit for new users (MiB)
  defaultLimitMiB: 50
  # Daily check-in reward (MiB). Set to 0 to disable.
  checkInRewardMiB: 1

# -- OAUTH LOGIN CONFIGURATION --
# Enable third-party OAuth login providers
oauth:
  # GitHub OAuth Configuration
  github:
    enabled: false
    clientId: ""
    clientSecret: ""
    callbackUrl: "http://localhost:8000/api/oauth/github/callback"

  # Discord OAuth Configuration
  # Login requests only `identify`. Registration additionally requests
  # `guilds.members.read` when the guild-membership rule is enabled. Email is not requested.
  discord:
    enabled: false
    clientId: ""
    clientSecret: ""
    callbackUrl: "http://localhost:8000/api/oauth/discord/callback"

  # Linux.do OAuth Configuration (OpenID Connect)
  linuxdo:
    enabled: false
    clientId: ""
    clientSecret: ""
    callbackUrl: "http://localhost:8000/api/oauth/linuxdo/callback"
    # OIDC 配置端点（可选；配置后将自动从该端点获取授权、令牌和用户信息端点）
    wellKnownEndpoint: ""
    # Linux.do OAuth endpoints（如果未配置 wellKnownEndpoint，则使用以下默认值）# Linux.do OAuth endpoints
    authUrl: "https://connect.linux.do/oauth2/authorize"
    tokenUrl: "https://connect.linux.do/oauth2/token"
    userInfoUrl: "https://connect.linux.do/api/user"

# -- PUBLIC PAGES CONFIGURATION --
# Enable public character sharing page
enablePublicCharacters: true
# Enable forum/community page
enableForum: true
stcontrol:
  # Enable only after the local stcontrol Agent has enrolled successfully.
  enabled: false
  controllerUrl: ""
  nodeId: 0
  # Prefer the STCONTROL_AGENT_PSK environment variable in production.
  agentPsk: ""
  controllerGeneration: 0
  # Managed activity policy. Browser heartbeat intervals are capped below
  # half of sessionIdleMs so an open foreground/background page stays online.
  sessionIdleMs: 900000
  foregroundHeartbeatMs: 120000
  backgroundHeartbeatMs: 300000
  # The Agent renews this per-user snapshot gate while copying. If the Agent
  # crashes or loses the loopback adapter, the gate expires and cannot freeze
  # the user indefinitely. Valid range: 10000..300000 milliseconds.
  snapshotGateLeaseMs: 30000
email:
  enabled: false
  smtp:
    host: smtp.exmail.qq.com
    port: 465
    secure: true
    user: your-email@example.com
    password: password
  from: your-email@example.com
  fromName: SillyTavern
scheduledTasks:
  clearAllBackups:
    enabled: true
    cronExpression: 0 */1 * * *
# 酒馆 Git: per-user version history of tavern data, synced to any git host over HTTPS.
# Repositories live in <dataRoot>/_git/<user> and count toward the user's storage quota.
gitSync:
  enabled: true
  # Feature modules to serve; "core" is always on.
  # Available: core, history, branches, remotes, tags, safety, autoBackup
  modules: [core, history, branches, remotes, tags, safety, autoBackup]
  # Allow remotes on private/loopback addresses (self-hosted Gitea on the same network).
  # Leave off on public servers: users could otherwise reach internal services.
  allowPrivateNetworks: false
  # Allow plain http:// remotes on public addresses.
  allowHttp: false
  # 酒馆云: a Forgejo/Gitea server run by the site, so users can back up online without an
  # account of their own. Each user gets a private repository <org>/<site>--<handle>, read and
  # written with this token (scopes write:organization, write:repository), which never leaves
  # the server. Leave url empty to turn it off.
  hosted:
    url: ''
    token: ''
    org: tavern
    # This site's id (lowercase letters, digits, -); part of repository names.
    site: ''
    # Sites sharing the server, id: label. Discord accounts may restore from any of them.
    sites: {}
    label: 酒馆云
# 排行榜: rankings (AI replies, characters, online time, ...) shared by the sites. Everybody
# takes part, as 匿名用户#number or, if they choose, as their display name#number.
leaderboard:
  enabled: false
  # The badge this site's users get: legacy (老站) or modern (新站).
  site: legacy
  # The same long random text on all sites (at least 16 characters). People with the same
  # Discord account on two sites are merged by a hash keyed with it. Empty: this site alone.
  secret: ''
  # The other sites, fetched every syncIntervalMs: - url: https://other.example
  peers: []
  syncIntervalMs: 3000
# Live channel: a WebSocket from every open page, so administrators can reload pages or show a
# message right away (admin panel → 实时推送). It needs the reverse proxy to pass WebSocket upgrades.
live:
  enabled: true
